# Prüfungen für den HA-Marketplace (HACS-Action + hassfest) und die Tests.
# Dieses Repo ist ein Spiegel von github.com/Sedrah87/HASS-ADHSTrack – Änderungen nur dort.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # PolyForm Noncommercial ist keine OSI-Lizenz; die Prüfung entfällt nur für eigene Läufe
          # (eine Aufnahme in den Standard-Katalog wäre damit nicht möglich).
          ignore: license

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -q -r requirements_test.txt
      - run: python -m pytest -q

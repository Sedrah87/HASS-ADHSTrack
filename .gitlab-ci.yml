# Ablauf: Privatsphäre prüfen → Tests → (nur main und Tags) nach GitHub spiegeln.
# Der GitHub-Spiegel wird ausschließlich hier aktualisiert. Ein GitLab-Push-Mirror darf NICHT
# zusätzlich eingerichtet sein, sonst gelangen Änderungen ungeprüft nach GitHub.
#
# Benötigte CI/CD-Variablen (Settings › CI/CD › Variables):
#   VERBOTENE_MUSTER  private Angaben als Regex, durch | getrennt (nicht geschützt, damit jeder Branch geprüft wird)
#   GITHUB_TOKEN      Fine-grained Token für Sedrah87/HASS-ADHSTrack (Contents + Workflows: Read and write),
#                     geschützt und maskiert

stages:
  - pruefen
  - test
  - spiegeln

variables:
  GIT_DEPTH: "0"          # vollständige Historie für die Prüfung
  GIT_FETCH_EXTRA_FLAGS: "--tags"

privatsphaere:
  stage: pruefen
  image: alpine/git:latest
  script:
    - sh scripts/privatsphaere_pruefen.sh historie

pytest:
  stage: test
  image: python:3.14
  before_script:
    - pip install -q -r requirements_test.txt
  script:
    - python -m pytest -q

github:
  stage: spiegeln
  image: alpine/git:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - test -n "$GITHUB_TOKEN" || { echo "❌ GITHUB_TOKEN fehlt"; exit 1; }
    - ZIEL="https://x-access-token:${GITHUB_TOKEN}@github.com/Sedrah87/HASS-ADHSTrack.git"
    # GitLab ist die Quelle: GitHub wird auf denselben Stand gebracht (auch nach umgeschriebener Historie).
    - if [ -n "${CI_COMMIT_BRANCH:-}" ]; then git push --force "$ZIEL" "$CI_COMMIT_SHA:refs/heads/main"; fi
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then git push --force "$ZIEL" "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"; fi
